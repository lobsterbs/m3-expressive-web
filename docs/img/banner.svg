<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140" role="img" aria-label="m3-expressive-web — Material 3 Expressive for the web">
  <!-- A tidy row of M3 Expressive shapes, evenly spaced on a shared baseline:
       cookie(9) · soft square · pill · full circle · 28dp-rounded square · clover(4) -->
  <g transform="translate(40,55)">
    <!-- cookie 9-sided scalloped shape -->
    <path d="M24 0c2-9 12-13 19-8 7-6 17-2 18 7 10 0 16 9 12 17 8 5 8 16 0 21 4 8-2 17-12 17-1 9-11 13-18 7-7 6-17 2-19-8-10 0-16-9-13-17-8-5-8-16 0-21-4-8 2-16 13-17z" transform="translate(-8,-16) scale(1.05)" fill="#EADDFF"/>
    <!-- soft square -->
    <rect x="76" y="-4" width="46" height="46" rx="14" fill="#7D5260" opacity=".9"/>
    <!-- pill -->
    <rect x="146" y="11" width="76" height="18" rx="9" fill="#6750A4"/>
    <!-- full circle -->
    <circle cx="252" cy="19" r="23" fill="none" stroke="#6750A4" stroke-width="3"/>
    <!-- 28dp-equivalent rounded square -->
    <rect x="300" y="-4" width="46" height="46" rx="16" fill="#CCC2DC"/>
    <!-- clover 4-leaf -->
    <path d="M396 19c-8-8-8-16 0-19 8-3 16 3 19 11 3-8 11-14 19-11 8 3 8 11 0 19 8 8 8 16 0 19-8 3-16-3-19-11-3 8-11 14-19 11-8-3-8-11 0-19z" fill="#FFD8E4"/>
  </g>
  <text x="40" y="118" font-family="'Google Sans Flex', Roboto, system-ui, sans-serif" font-size="22" font-weight="600" fill="#6750A4">Material 3 Expressive — for the web</text>
  <text x="598" y="118" font-family="ui-monospace, monospace" font-size="13" fill="#79747E">exact spec values</text>
</svg>